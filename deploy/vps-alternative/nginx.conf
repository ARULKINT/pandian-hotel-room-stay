# Nginx site config for Pandian Hotel & Room Stay.
#
# Install: copy to /etc/nginx/sites-available/pandian-hotel, then:
#   sudo ln -s /etc/nginx/sites-available/pandian-hotel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN below before use. If you don't have a domain yet, use
# the server's IP address here temporarily and add the domain once you have one
# (certbot in the runbook needs a real domain to issue HTTPS certificates).

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Static frontend build (see runbook step "Build the frontend").
    root /var/www/pandian-hotel/frontend/dist;
    index index.html;

    # This is a hash-router SPA (#/home, #/rooms, ...) — the server only ever
    # sees requests for "/" and static asset paths, never the hash routes
    # themselves, so a single fallback to index.html covers everything.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML shell itself (so deploys of new JS/CSS bundles are
    # picked up immediately); let the hashed asset filenames be cached hard.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:js|css|jpg|jpeg|png|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # API + admin auth — proxied straight through to the Node backend, which
    # is only listening on localhost and is never reachable directly.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 1m;
}

# After running certbot (see runbook), it edits this file in place to add a
# matching `listen 443 ssl;` server block and a redirect from 80 -> 443.
# You don't need to write that part by hand.
